<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>どこかに行こうマップ</title>
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.2/mapbox-gl-draw.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100%; height: 95vh; }
    .buttons {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;
    }
    .buttons button {
      margin: 3px;
      padding: 8px 12px;
      font-size: 14px;
      background: #ffffffcc;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
    }
    #result-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.5s ease;
    }
    .result-card {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      animation: pop 0.5s ease;
      max-width: 80%;
    }
    .result-card h1 {
      font-size: 2rem;
      margin: 10px 0;
    }
    .result-card button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="buttons">
    <button onclick="selectRandomSpot()">全国から選ぶ！</button>
    <button onclick="selectRandomSpotWithinPolygon()">囲んだ中から選ぶ！</button>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.2/mapbox-gl-draw.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'google-maps-standard': {
            type: 'raster',
            tiles: [
              'https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}'
            ],
            tileSize: 256,
            attribution: 'Map data &copy; <a href="https://www.google.com/intl/en_us/help/terms_maps/" target="_blank">Google</a>',
            maxzoom: 21
          }
        },
        layers: [
          {
            id: 'google-maps-standard-layer',
            type: 'raster',
            source: 'google-maps-standard'
          }
        ]
      },
      center: [137.5, 38.0],
      zoom: 4.2
    });

    const draw = new MapboxDraw({
      displayControlsDefault: false,
      controls: {
        polygon: true,
        trash: true
      }
    });
    map.addControl(draw);

    let allFeatures = [];

    map.on('load', () => {
      // GeoJSON 1 読み込み
      fetch('map (1).geojson')
        .then(res => res.json())
        .then(data => {
          map.addSource('kanko-geojson', { type: 'geojson', data });
          map.addLayer({
            id: 'kanko-layer',
            type: 'circle',
            source: 'kanko-geojson',
            paint: {
              'circle-radius': 8,
              'circle-color': '#fff',
              'circle-stroke-width': 3,
              'circle-stroke-color': '#000'
            }
          });
          allFeatures.push(...data.features);
          addPopupOnHover('kanko-layer');
        });

      // GeoJSON 3 読み込み
      fetch('map (3).geojson')
        .then(res => res.json())
        .then(data => {
          map.addSource('kanko-geojson-3', { type: 'geojson', data });
          map.addLayer({
            id: 'kanko-layer-3',
            type: 'circle',
            source: 'kanko-geojson-3',
            paint: {
              'circle-radius': 8,
              'circle-color': '#fff',
              'circle-stroke-width': 3,
              'circle-stroke-color': '#000'
            }
          });
          allFeatures.push(...data.features);
          addPopupOnHover('kanko-layer-3');
        });
      // GeoJSON 4 読み込み
      fetch('map (4).geojson')
        .then(res => res.json())
        .then(data => {
          map.addSource('kanko-geojson-4', { type: 'geojson', data });
          map.addLayer({
            id: 'kanko-layer-4',
            type: 'circle',
            source: 'kanko-geojson-4',
            paint: {
              'circle-radius': 8,
              'circle-color': '#fff',
              'circle-stroke-width': 3,
              'circle-stroke-color': '#000'
            }
          });
          allFeatures.push(...data.features);
          addPopupOnHover('kanko-layer-4', true);
        });
    });

    function addPopupOnHover(layerId) {
      const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false });
      map.on('mouseenter', layerId, e => {
        map.getCanvas().style.cursor = 'pointer';
        const feature = e.features[0];
        const coords = feature.geometry.coordinates;
        let html = '';
        if (feature.properties.explanation) {
          html = `<h3>${feature.properties.name || ''}</h3><p>${feature.properties.explanation}</p>`;
        } else {
          html = `<h3>${feature.properties.name || ''}</h3><p>${feature.properties.adress || ''}</p>`;
        }
        popup.setLngLat(coords).setHTML(html).addTo(map);
      });
      map.on('mouseleave', layerId, () => {
        map.getCanvas().style.cursor = '';
        popup.remove();
      });
    }

    function selectRandomSpot() {
      if (allFeatures.length === 0) return;
      const spot = allFeatures[Math.floor(Math.random() * allFeatures.length)];
      showRandomResultAnimation(spot);
    }

    function selectRandomSpotWithinPolygon() {
      const polygon = draw.getAll();
      if (!polygon.features.length) {
        alert("まず地図上でポリゴン（範囲）を描いてください。");
        return;
      }
      const pointsInPolygon = turf.pointsWithinPolygon({
        type: "FeatureCollection",
        features: allFeatures
      }, polygon.features[0]);

      if (!pointsInPolygon.features.length) {
        alert("選択された範囲内に観光地が見つかりませんでした。");
        return;
      }

      const spot = pointsInPolygon.features[Math.floor(Math.random() * pointsInPolygon.features.length)];
      showRandomResultAnimation(spot);
    }

    function showRandomResultAnimation(spot) {
      map.flyTo({
        center: spot.geometry.coordinates,
        zoom: 14,
        essential: true
      });

      map.once('moveend', () => {
        new maplibregl.Popup()
          .setLngLat(spot.geometry.coordinates)
          .setHTML(`<h3>${spot.properties.name || 'Unknown'}</h3><p>${spot.properties.adress || ''}</p>`)
          .addTo(map);

        const lat = spot.geometry.coordinates[1];
        const lng = spot.geometry.coordinates[0];
        const destination = encodeURIComponent(`${lat},${lng}`);
        const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${destination}&travelmode=transit`;

        const overlay = document.createElement('div');
        overlay.id = 'result-overlay';
        overlay.innerHTML = `
          <div class="result-card">
            <h2>あなたの旅先は…</h2>
            <h1>${spot.properties.name || 'Unknown'}</h1>
            <p>${spot.properties.adress || ''}</p>
            <button onclick="window.open('${googleMapsUrl}', '_blank')">今から行く！</button>
            <br><br>
            <button onclick="tryAgain()">もう一度引く！</button>
            <button onclick="closeResult()">閉じる</button>
          </div>
        `;
        document.body.appendChild(overlay);
      });
    }

    function tryAgain() {
      closeResult();
      const newSpot = allFeatures[Math.floor(Math.random() * allFeatures.length)];
      showRandomResultAnimation(newSpot);
    }

    function closeResult() {
      const overlay = document.getElementById('result-overlay');
      if (overlay) overlay.remove();
    }
  </script>
</body>
</html>
