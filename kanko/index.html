<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ランダム観光地（範囲選択）マップ</title>
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.2/mapbox-gl-draw.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100%; height: 95vh; }
    .buttons {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;
    }
    .buttons button {
      margin: 3px;
      padding: 8px 12px;
      font-size: 14px;
      background: #ffffffcc;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="buttons">
    <button onclick="selectRandomSpot()">全国から選ぶ！</button>
    <button onclick="selectRandomSpotWithinPolygon()">囲んだ中から選ぶ！</button>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.2/mapbox-gl-draw.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'google-satellite-hybrid': {
            type: "raster",
            tiles: [
              "https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}"
            ],
            tileSize: 256,
            attribution: "Map data &copy; <a href='https://www.google.com/intl/en_us/help/terms_maps/' target='_blank'>Google</a>",
            maxzoom: 21
          }
        },
        layers: [{
          id: "google-satellite-hybrid-layer",
          type: "raster",
          source: "google-satellite-hybrid"
        }]
      },
      center: [139.7671, 35.6812],
      zoom: 5
    });

    const draw = new MapboxDraw({
      displayControlsDefault: false,
      controls: {
        polygon: true,
        trash: true
      }
    });
    map.addControl(draw);

    let allFeatures = [];

    map.on('load', () => {
      // map (1).geojson 読み込み
      fetch('map (1).geojson')
        .then(res => res.json())
        .then(data => {
          map.addSource('kanko-geojson', {
            type: 'geojson',
            data: data
          });
          map.addLayer({
            id: 'kanko-layer',
            type: 'circle',
            source: 'kanko-geojson',
            paint: {
              'circle-radius': 6,
              'circle-color': '#FF5722',
              'circle-stroke-width': 2,
              'circle-stroke-color': '#fff'
            }
          });
          allFeatures.push(...data.features);
          addPopupOnHover('kanko-layer');
        });

      // map (3).geojson 読み込み
      fetch('map (3).geojson')
        .then(res => res.json())
        .then(data => {
          map.addSource('kanko-geojson-3', {
            type: 'geojson',
            data: data
          });
          map.addLayer({
            id: 'kanko-layer-3',
            type: 'circle',
            source: 'kanko-geojson-3',
            paint: {
              'circle-radius': 8,
              'circle-color': '#2196F3',
              'circle-stroke-width': 2,
              'circle-stroke-color': '#fff'
            }
          });
          allFeatures.push(...data.features);
          addPopupOnHover('kanko-layer-3');
        });
    });

    function addPopupOnHover(layerId) {
      const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false });
      map.on('mouseenter', layerId, e => {
        map.getCanvas().style.cursor = 'pointer';
        const feature = e.features[0];
        const coords = feature.geometry.coordinates;
        const name = feature.properties.name || '';
        const address = feature.properties.adress || '';
        popup.setLngLat(coords).setHTML(`<h3>${name}</h3><p>${address}</p>`).addTo(map);
      });
      map.on('mouseleave', layerId, () => {
        map.getCanvas().style.cursor = '';
        popup.remove();
      });
    }

    function selectRandomSpot() {
      if (allFeatures.length === 0) return;
      const spot = allFeatures[Math.floor(Math.random() * allFeatures.length)];
      showPopupAt(spot);
    }

    function selectRandomSpotWithinPolygon() {
      const polygon = draw.getAll();
      if (!polygon.features.length) {
        alert("まず地図上でポリゴン（範囲）を描いてください。");
        return;
      }
      const pointsInPolygon = turf.pointsWithinPolygon({
        type: "FeatureCollection",
        features: allFeatures
      }, polygon.features[0]);

      if (!pointsInPolygon.features.length) {
        alert("選択された範囲内に観光地が見つかりませんでした。");
        return;
      }

      const spot = pointsInPolygon.features[Math.floor(Math.random() * pointsInPolygon.features.length)];
      showPopupAt(spot);
    }

    function showPopupAt(spot) {
      const coords = spot.geometry.coordinates;
      const name = spot.properties.name || '';
      const address = spot.properties.adress || '';
      map.flyTo({ center: coords, zoom: 14 });
      new maplibregl.Popup()
        .setLngLat(coords)
        .setHTML(`<h3>${name}</h3><p>${address}</p>`)
        .addTo(map);
    }
  </script>
</body>
</html>
